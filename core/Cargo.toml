[package]
name = "flowneuro_core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Flow's on-device FlowNeuro recommendation engine (from Flow-Tube/Flow-Desktop), packaged with a C API for the FlowTube iOS tweak"

[lib]
name = "flowneuro_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tracing = "0.1"
snowstem = "0.1"
unicode-normalization = "0.1"
icu_properties = "2"
icu_segmenter = { version = "2", default-features = false, features = ["compiled_data"] }

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = "debuginfo"
